name: Update match data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch matches from football-data.org
        run: |
          mkdir -p data
          curl -sf -H "X-Auth-Token: 70a2145b7d004095a61e31b8c225a835" \
            "https://api.football-data.org/v4/competitions/WC/matches?limit=500" \
            -o data/matches.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          git diff --staged --quiet || git commit -m "chore: update match data [skip ci]"
          git push
